<svg
  class="plano"
  role="group"
  aria-label="Plano del local"
  [attr.viewBox]="shownViewBox()"
  [attr.data-interactive]="interactive() ? '' : null"
  [style.--stone]="colors().stone"
  [style.--band]="colors().band"
  [style.--line]="colors().line"
  [style.--topStroke]="colors().topStroke"
  [style.--seatInk]="colors().seatInk"
  [style.--badge]="colors().badge"
  [style.--sel]="stateColors.sel"
  [style.--pending]="stateColors.pending"
  [style.--taken]="stateColors.taken"
>
  <defs>
    <pattern [attr.id]="ids.floor" width="200" height="200" patternUnits="userSpaceOnUse">
      @for (tile of floorTiles; track $index) {
        <rect
          [attr.x]="tile.x"
          [attr.y]="tile.y"
          width="100"
          height="100"
          [attr.fill]="tile.vertical ? colors().floorB : colors().floorA"
        />
        @for (line of tile.lines; track $index) {
          <line
            [attr.x1]="line.x1"
            [attr.y1]="line.y1"
            [attr.x2]="line.x2"
            [attr.y2]="line.y2"
            [attr.stroke]="colors().plank"
            stroke-width="1.5"
          />
        }
      }
    </pattern>
    <linearGradient [attr.id]="ids.tabletop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" [attr.stop-color]="colors().topA" />
      <stop offset="1" [attr.stop-color]="colors().topB" />
    </linearGradient>
    <linearGradient [attr.id]="ids.cushion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" [attr.stop-color]="colors().cushA" />
      <stop offset="1" [attr.stop-color]="colors().cushB" />
    </linearGradient>
    <filter [attr.id]="ids.wood">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.015 0.3"
        numOctaves="3"
        seed="4"
        result="n"
      />
      <feColorMatrix in="n" [attr.values]="grainMatrix()" />
      <feComposite in2="SourceGraphic" operator="in" result="g" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="g" />
      </feMerge>
    </filter>
    <clipPath [attr.id]="ids.room">
      <polygon [attr.points]="polygonPoints()" />
    </clipPath>
  </defs>

  <polygon class="wall-stone" [attr.points]="polygonPoints()" />
  <polygon [attr.fill]="ref(ids.floor)" [attr.points]="polygonPoints()" />
  <polygon class="wall-band" [attr.clip-path]="ref(ids.room)" [attr.points]="polygonPoints()" />
  <polygon class="wall-line" [attr.points]="polygonPoints()" />

  @for (drawn of drawnTables(); track drawn.table.id) {
    <g
      [attr.class]="'t ' + stateOf(drawn.table.id)"
      [attr.role]="interactive() ? 'button' : 'img'"
      [attr.data-table-id]="drawn.table.id"
      [attr.tabindex]="isSelectable(drawn.table.id) ? 0 : null"
      [attr.aria-disabled]="interactive() && stateOf(drawn.table.id) === 'blocked' ? 'true' : null"
      [attr.aria-label]="ariaLabel(drawn.table)"
      (click)="activate(drawn.table)"
      (keydown)="onKeydown($event, drawn.table)"
    >
      <g class="shadow" [attr.transform]="drawn.transform">
        @for (chair of drawn.chairs; track $index) {
          <g
            class="seat"
            [attr.transform]="
              'translate(' + chair.x + ' ' + chair.y + ') rotate(' + chair.deg + ')'
            "
          >
            <rect
              class="seat-box"
              x="-17"
              y="-16"
              width="34"
              height="33"
              rx="10"
              [attr.fill]="ref(ids.cushion)"
            />
            <path class="seat-back" d="M-18 15 Q0 27 18 15" />
          </g>
        }
        @if (drawn.radius !== null) {
          <circle
            class="top"
            [attr.r]="drawn.radius"
            [attr.fill]="ref(ids.tabletop)"
            [attr.filter]="ref(ids.wood)"
          />
        } @else if (drawn.rect) {
          <rect
            class="top"
            rx="7"
            [attr.x]="drawn.rect.x"
            [attr.y]="drawn.rect.y"
            [attr.width]="drawn.rect.width"
            [attr.height]="drawn.rect.height"
            [attr.fill]="ref(ids.tabletop)"
            [attr.filter]="ref(ids.wood)"
          />
        }
      </g>
      <rect
        class="badge"
        [attr.x]="drawn.table.x - drawn.badgeWidth / 2"
        [attr.y]="drawn.table.y - 20"
        [attr.width]="drawn.badgeWidth"
        height="40"
        rx="20"
      />
      <text
        class="tag"
        [attr.x]="drawn.table.x"
        [attr.y]="drawn.table.y"
        [style.font-size.px]="drawn.badgeFont"
        [textContent]="drawn.table.label"
      ></text>
    </g>
  }
</svg>
