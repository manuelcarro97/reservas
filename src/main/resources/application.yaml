server:
  port: ${PORT:8080}

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:reservas-6d51b}
    # Solo por variable de entorno, nunca en el repo. Sin ella, borrar una cuenta no borra su usuario de Firebase
    # (solo queda en el log).
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  telegram:
    # Solo por variable de entorno, nunca en el repo. Sin token no hay Telegram: los avisos van al log.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
  demo:
    # La cuenta demo y su plano, restaurados al arrancar y cada noche. Apagado salvo el perfil demo o DEMO_ENABLED=true.
    # El email y la contraseña solo por variable de entorno, nunca en el repo; sin ellos el plano se siembra pero la
    # cuenta del proveedor de identidad no se toca. El uid es fijo: no cambia aunque alguien borre la cuenta del proveedor.
    enabled: ${DEMO_ENABLED:false}
    uid: ${DEMO_UID:demo-owner}
    email: ${DEMO_EMAIL:}
    password: ${DEMO_PASSWORD:}

spring:
  application:
    name: reservas-api
  flyway:
    # Una base que cargó el antiguo seed repetible de la demo (R__demo_restaurant, ya sustituido por el seeder en Java)
    # debe seguir arrancando aunque esa migración ya no exista.
    ignore-migration-patterns: '*:future,repeatable:missing'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
