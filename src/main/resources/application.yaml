server:
  port: ${PORT:8080}

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:reservas-6d51b}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring:
  application:
    name: reservas-api
  flyway:
    # Los datos de demo son opcionales: una base que los cargó debe arrancar también sin ese perfil.
    ignore-migration-patterns: '*:future,repeatable:missing'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
